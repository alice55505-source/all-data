<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>all統計</title>
<meta name="description" content="上傳各召會週報，自訂勾選要統計的聚會與身份組合，計算每週平均並彙總全台總計" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://all-children.pages.dev/" />
<meta property="og:title" content="all統計" />
<meta property="og:description" content="上傳各召會週報，自訂勾選要統計的聚會與身份組合，計算每週平均並彙總全台總計" />
<meta property="og:image" content="https://all-children.pages.dev/icons/icon-512.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="all統計" />
<meta name="twitter:description" content="上傳各召會週報，自訂勾選要統計的聚會與身份組合，計算每週平均並彙總全台總計" />
<meta name="twitter:image" content="https://all-children.pages.dev/icons/icon-512.png" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="all統計" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="app-header-row">
      <div>
        <h1>all統計</h1>
      </div>
      <div class="header-btn-row">
        <button class="btn-secondary settings-btn" id="open-metrics-settings-btn" style="display:none;">⚙ 設定統計欄位</button>
        <button class="btn-secondary settings-btn" id="open-settings-btn" style="display:none;">⚙ 設定召會</button>
      </div>
    </div>
    <p class="current-metrics-summary" id="current-metrics-summary" style="display:none;"></p>
  </header>

  <section class="card" id="landing-screen">
    <h2>開始使用</h2>
    <div class="card-actions">
      <button class="btn-primary" id="create-room-btn">建立新房間</button>
    </div>
    <div class="field" style="margin-top:1rem;">
      <label for="join-room-input">輸入房間代碼加入</label>
      <div class="join-room-row">
        <input type="text" id="join-room-input" placeholder="例如 ABC123" maxlength="12" />
        <button class="btn-secondary" id="join-room-btn">加入</button>
      </div>
    </div>
    <div class="status-msg" id="landing-status-msg"></div>
  </section>

  <div class="room-bar" id="room-bar" style="display:none;">
    <div class="room-bar-info">
      <span class="room-name" id="room-name-display"></span>
      <button class="btn-danger-ghost room-rename-btn" id="rename-room-btn" title="幫房間命名">✏️ 命名</button>
      <span>房間代碼：<strong id="room-code-display"></strong></span>
    </div>
    <div class="room-bar-actions">
      <button class="btn-secondary" id="copy-room-code-btn">複製房間代碼</button>
      <button class="btn-secondary" id="refresh-room-btn">重新整理資料</button>
      <button class="btn-secondary" id="leave-room-btn">離開房間</button>
    </div>
  </div>

  <div id="app-main" style="display:none;">

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab-target="stats">週報統計</button>
    <button class="tab-btn" data-tab-target="rollcall">點名</button>
  </nav>

  <div data-tab-panel="stats">

  <section class="card">
    <div class="upload-row">
      <select id="congregation-select" aria-label="召會"></select>
      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept=".xlsx,.csv" aria-label="週報檔" />
      </div>
    </div>
    <div class="file-picked" id="file-picked"></div>
    <div class="upload-actions">
      <button class="btn-primary" id="parse-btn">解析並加入</button>
      <button class="btn-secondary" id="reset-all-btn">清除全部</button>
    </div>
    <div class="status-msg" id="status-msg"></div>
    <details class="progress-details">
      <summary>
        <span>已上傳 <span class="progress-count"><span id="stats-progress-count">0</span> / <span id="stats-progress-total">0</span></span></span>
        <span class="progress-bar-track"><span class="progress-bar-fill" id="stats-progress-bar" style="width:0%"></span></span>
      </summary>
      <div class="chip-grid" id="stats-chip-grid"></div>
    </details>
  </section>

  <section class="card">
    <h2>週別區間</h2>
    <div class="checkbox-grid" id="period-options"></div>
    <p class="modal-hint" id="period-detected" style="display:none;"></p>
    <div class="card-actions">
      <button class="btn-secondary" id="open-period-btn">設定週別分組</button>
    </div>
    <div class="summary-warn" id="period-warn" style="display:none;"></div>
  </section>

  <section class="card">
    <h2>各召會結果 <span class="badge" data-period-badge style="display:none;"></span></h2>
    <div class="table-scroll">
      <table>
        <thead id="stats-results-thead"></thead>
        <tbody id="stats-results-tbody"></tbody>
      </table>
    </div>
    <div class="empty-hint" id="stats-results-empty">尚無資料</div>
    <div class="card-actions">
      <button class="btn-secondary" id="stats-download-btn" disabled>下載 Excel</button>
    </div>
  </section>

  <section class="card">
    <h2>全台總計 <span class="badge" data-period-badge style="display:none;"></span></h2>
    <div class="summary-grid" id="stats-summary-grid"></div>
    <div class="summary-warn" id="stats-summary-warn" style="display:none;"></div>
  </section>

  </div>

  <div data-tab-panel="rollcall" style="display:none;">
  <section class="card">
    <div class="upload-row">
      <select id="rollcall-congregation-select" aria-label="召會"></select>
      <div class="dropzone" id="rollcall-dropzone">
        <input type="file" id="rollcall-file-input" accept=".xlsx,.csv" aria-label="點名報表檔" />
      </div>
    </div>
    <div class="file-picked" id="rollcall-file-picked"></div>
    <div class="upload-actions">
      <button class="btn-primary" id="rollcall-parse-btn">解析並加入</button>
      <button class="btn-secondary" id="rollcall-reset-btn">清除全部</button>
    </div>
    <div class="status-msg" id="rollcall-status-msg"></div>
    <details class="progress-details">
      <summary>
        <span>已上傳 <span class="progress-count"><span id="rollcall-progress-count">0</span> / <span id="rollcall-progress-total">0</span></span></span>
        <span class="progress-bar-track"><span class="progress-bar-fill" id="rollcall-progress-bar" style="width:0%"></span></span>
      </summary>
      <div class="chip-grid" id="rollcall-chip-grid"></div>
    </details>
  </section>

    <section class="card">
      <h2>各召會結果 <span class="badge">每月出席 ≥1 次人數</span></h2>
      <div class="group-filter" id="rollcall-group-filter"></div>
      <div class="group-filter-actions">
        <button class="btn-secondary" id="rollcall-group-all-btn">全選</button>
        <button class="btn-secondary" id="rollcall-group-none-btn">全不選</button>
      </div>
      <div class="empty-hint" id="rollcall-group-empty" style="display:none;"></div>
      <div class="table-scroll">
        <table>
          <thead><tr id="rollcall-results-thead-row"></tr></thead>
          <tbody id="rollcall-results-tbody"></tbody>
        </table>
      </div>
      <div class="empty-hint" id="rollcall-results-empty">尚無資料</div>
      <div class="card-actions">
        <button class="btn-secondary" id="rollcall-download-btn" disabled>下載 Excel</button>
      </div>
    </section>

    <section class="card">
      <h2>全台總計</h2>
      <div class="summary-grid" id="rollcall-summary-grid"></div>
      <div class="summary-warn" id="rollcall-summary-warn" style="display:none;"></div>
    </section>
  </div>

  </div>
</div>

<div class="modal-backdrop" id="settings-backdrop" style="display:none;">
  <div class="modal">
    <h2>設定召會清單</h2>
    <p class="modal-hint">區域一行，召會縮排。</p>
    <textarea id="settings-textarea" rows="14" placeholder="例如：
雲東區
  斗六
  古坑
  林內
雲西區
  西螺
  莿桐"></textarea>
    <p class="modal-hint" id="settings-count"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="settings-clear-btn">清空全部</button>
      <button class="btn-secondary" id="settings-default-btn">還原預設清單</button>
      <div class="modal-actions-right">
        <button class="btn-secondary" id="settings-cancel-btn">取消</button>
        <button class="btn-primary" id="settings-save-btn">儲存並套用</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="metrics-settings-backdrop" style="display:none;">
  <div class="modal">
    <h2>設定統計欄位</h2>

    <div class="field">
      <label>快速選擇</label>
      <div class="card-actions" style="margin-top:0;">
        <button type="button" class="btn-secondary" id="metrics-preset-children-btn">全台兒童</button>
        <button type="button" class="btn-secondary" id="metrics-preset-youth-btn">全台青職</button>
      </div>
    </div>

    <div class="field">
      <label>聚會選擇</label>
      <div class="checkbox-grid" id="metrics-meeting-options"></div>
    </div>

    <div class="field">
      <label>Role 群組</label>
      <div class="checkbox-grid" id="metrics-role-options"></div>
    </div>

    <div class="field">
      <label>額外</label>
      <div class="checkbox-grid" id="metrics-extra-options"></div>
    </div>

    <p class="modal-hint" id="metrics-settings-count"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="metrics-settings-clear-btn">清空全部</button>
      <div class="modal-actions-right">
        <button class="btn-secondary" id="metrics-settings-cancel-btn">取消</button>
        <button class="btn-primary" id="metrics-settings-save-btn">儲存並套用</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="period-backdrop" style="display:none;">
  <div class="modal">
    <h2>設定週別分組</h2>
    <div class="field">
      <label for="period-quick-input">快速分組：依序填每組週數</label>
      <div class="join-room-row">
        <input type="text" id="period-quick-input" placeholder="例如 4,5（前 4 週一組、後 5 週一組）" />
        <button class="btn-secondary" id="period-quick-btn">套用</button>
      </div>
    </div>
    <div class="field">
      <label>組別</label>
      <div id="period-groups"></div>
      <button class="btn-secondary" id="period-add-btn" style="margin-top:0.4rem;">＋ 新增組別</button>
    </div>
    <div class="field">
      <label>各週所屬組別</label>
      <div id="period-weeks"></div>
    </div>
    <div class="modal-actions">
      <span></span>
      <div class="modal-actions-right">
        <button class="btn-secondary" id="period-cancel-btn">取消</button>
        <button class="btn-primary" id="period-save-btn">儲存並套用</button>
      </div>
    </div>
  </div>
</div>

<script src="js/xlsx.core.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
